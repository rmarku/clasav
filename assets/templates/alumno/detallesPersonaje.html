<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">


        <div class="container-fluid">
            <div class="row">
                <div >
                    <div class="page-header" align="center" style="margin-top: 0px">
                        <b class="titulos">
                            Personaje
                        </b>
                    </div>

                    <table class="table table-striped table-hover table" style="width: 100%">

                        <tr>
                            <th class="text-center" style="width: 180px">Nombre</th>
                            <td class="text-center"><span>{{miPersonaje.nombre}}</span></td>
                        </tr>

                        <tr>
                            <th class="text-center" style="width: 180px">Energía</th>
                            <td class="text-center"><span>{{miPersonaje.energia}}</span></td>
                        </tr>

                        <tr>
                            <th class="text-center" style="width: 180px">Nivel</th>
                            <td class="text-center"><span>{{miPersonaje.nivel}}</span></td>
                        </tr>

                        <tr>
                            <th class="text-center" style="width: 180px">Experiencia</th>
                            <td class="text-center"><span>{{miPersonaje.experiencia}}</span></td>
                        </tr>
                    </table>

                    <div class="page-header" align="left" style="margin-top: 0px">
                        <b class="titulos">
                            Logros
                        </b>
                    </div>

                    <span ng-repeat="clase in $parent.misClases">

                        <button  style="width:100%" type="button" class="btn btn-default btn" ng-click="mostrarLogrosClase[clase.id]=!mostrarLogrosClase[clase.id]">
                            {{clase.nombre}}
                                <span ng-class="{'fa fa-caret-up': mostrarLogrosClase[clase.id], 'fa fa-caret-down': !mostrarLogrosClase[clase.id]}" aria-hidden="true" >

                                </span>
                        </button>


                        <table class="table table-striped table-hover table" style="width: 100%">


                            <thead ng-show="mostrarLogrosClase[clase.id]">
                                <tr>
                                    <th>Nombre</th>
                                    <th class="text-center" style="width: 400px">Descripción</th>
                                    <th class="text-center" style="width: 30px"></th>

                                </tr>
                            </thead>


                            <tbody ng-show="mostrarLogrosClase[clase.id]" >
                                <tr ng-repeat="logro in miPersonaje.logros | filter : {clase: clase.id}">
                                    <td >
                                          <span>
                                            {{logro.nombre}}
                                          </span>
                                    </td>
                                    <td class="text-center">
                                          <span >
                                             {{logro.descripcion}}
                                          </span>
                                    </td>
                                    <td class="text-center">
                                          <span >
                                             {{logro.sprite}}
                                          </span>
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </span>


                </div>
            </div>
        </div>

    </div>
</div>
