<div class="container-fluid">
    <div class="col-md-6">
        <div class="div-form  text-left" style="margin: 0px 0px 0px auto;" ng-controller="personajeController">
            <span class="titulos">Tu personaje</span>

            <form role="form" method="post" ng-submit="crearCuenta()">
                <div class="form-group">
                    <label for="nombre">Nombre: </label>
                    <input type="text" class="form-control" name="nombreUsuario" ng-model="nombre"
                           placeholder="Introduce tu nombre">
                    <span> {{nombre}} </span>
                </div>
                <div class="form-group">
                    <label for="pelo">Tipo de pelo: </label>
                    <canvas id="pelo"></canvas>
                    <span> {{tipo_pelo}} </span>
                </div>
                <div class="form-group">
                    <label for="colorPelo">Color de pelo: </label>
                    <select name="colorPelo" ng-model="hairColor">
                        <option value="1" style="background:aqua"></option>
                        <option value="2" style="background:black"></option>
                        <option value="3" style="background:gold"></option>
                        <option value="3" style="background:gray"></option>
                        <option value="3" style="background:#ff4500"></option>
                        <option value="3" style="background:pink"></option>
                        <option value="3" style="background:purple"></option>
                        <option value="3" style="background:purple"></option>
                    </select>

                </div>
                <div align="right">
                    <button type="submit" class="btn btn-default  btn-align">
                        Crear
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="col-md-6">
        <canvas id="pj" width="32" height="64"></canvas>
    </div>
</div>
