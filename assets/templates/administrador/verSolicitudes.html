<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                Solicitudes de la institución {{$parent.institucionActual.nombre}}
            </b>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>


                    <table class="table table-striped table-hover table" style="width: 100%">
                        <thead>
                        <tr>
                            <th>Profesor</th>
                            <th>E-mail</th>
                            <th class="text-center" style="width: 50px">Aceptar</th>
                            <th class="text-center" style="width: 50px">Rechazar</th>
                        </tr>
                        </thead>


                        <tbody >
                        <tr ng-repeat="user in $parent.institucionActual.profesores_situacionEspera">
                            <td >

                                <span>
                                        {{user.apellido + " " + user.nombre}}
                                      </span>

                            </td>
                            <td>
                            <span>
                                        {{user.email}}
                                      </span>
                            </td>
                            <td class="text-center">
                                  <span class="fa fa-check"
                                        ng-click="aceptarProfesorEnInstitucion(user,$index)">
                                    </span>
                            </td>
                            <td class="text-center">
                                  <span class="fa fa-times"
                                        ng-click="rechazarProfesorEnInstitucion(user,$index)">
                                    </span>
                            </td>
                        </tr>
                        </tbody>


                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
