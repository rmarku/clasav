<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                {{$parent.institucionActual.nombre}}:<br>Solicitudes
            </b>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>


                    <table class="table table-striped table-hover table" style="width: 100%">
                        <thead ng-show="$parent.institucionActual.profesores_situacionEspera.length > 0">
                        <tr>
                            <th>Profesor</th>
                            <th>E-mail</th>
                            <th class="text-center" style="width: 50px">Aceptar</th>
                            <th class="text-center" style="width: 50px">Rechazar</th>
                        </tr>
                        </thead>


                        <tbody >
                        <tr ng-repeat="user in $parent.institucionActual.profesores_situacionEspera">
                            <td >

                                <span>
                                        {{user.apellido + " " + user.nombre}}
                                      </span>

                            </td>
                            <td>
                            <span>
                                        {{user.email}}
                                      </span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-default btn-xs" ng-click="aceptarProfesorEnInstitucion(user,$index)">
                                    <span class="fa fa-check" aria-hidden="true" ></span>
                                </button>

                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-default btn-xs" ng-click="rechazarProfesorEnInstitucion(user,$index)">
                                    <span class="fa fa-times" aria-hidden="true" ></span>
                                </button>
                            </td>

                        </tr>

                        <tr ng-if="$parent.institucionActual.profesores_situacionEspera.length < 1">
                            <td  class="text-center">
                                  <span>
                                     No existen profesores en espera para esta clase
                                  </span>
                            </td>
                        </tr>
                        </tbody>


                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
