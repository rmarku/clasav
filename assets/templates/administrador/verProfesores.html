<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                {{$parent.institucionActual.nombre}}:<br>Profesores
            </b>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>

                    <table class="table table-striped table-hover table" style="width: 100%">
                        <thead ng-show="$parent.institucionActual.profesores_situacionAceptado.length > 0">
                            <tr>
                                <th>Profesor</th>
                                <th>E-mail</th>
                            </tr>
                        </thead>

                        <tbody >
                            <tr ng-repeat="user in $parent.institucionActual.profesores_situacionAceptado">
                                <td >
                                      <span>
                                        {{user.apellido + " " + user.nombre}}
                                      </span>
                                </td>
                                <td >
                                     <span>
                                        {{user.email}}
                                      </span>
                                </td>
                            </tr>
                            <tr ng-if="$parent.institucionActual.profesores_situacionAceptado.length < 1">
                                <td  class="text-center">
                                  <span >
                                     No existen profesores en esta clase
                                  </span>
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
