<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <span class="titulos"> Crear Nueva Clase </span>

        <form novalidate="novalidate"role="form">
            <div class="form-group">
                <label for="nombre_clase">Nombre de la Clase: </label>
                <input type="text" class="form-control" name="nombre" ng-model="nombreClase"
                       placeholder="Introduce el nuevo nombre de tu clase" required>
            </div>

            <div class="form-group">
                <label for="mapa">Mapa Central de la Nueva Clase: </label>
                <select ng-model    ="mapa_seleccionado"
                        class       ="form-control"
                        ng-options  ="m.nombre for m in mapas" >
                </select>
            </div>

            <div class="form-group">
                <label>Institucion:</label>
                <br>
                <div class="form-group">
                    <select ng-model    ="institucion_seleccionada"
                            class       ="form-control"
                            ng-options  ="c.nombre for c in misInstitucionesStringConcatenado">
                    </select>
                </div>
            </div>



            <div>
                <button class="btn btn-default btn-align" ng-click="subirClase()">Confirmar Nueva Clase</button>
            </div>
        </form>
    </div>
</div>
