<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                Clases
            </b>
        </div>

        <div>
            <button class="btn btn-default btn-align" ng-click="crearClase()">Crear Clase</button>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>

                    <table class="table table-striped table-hover table" style="width: 100%">
                        <thead>
                        <tr>
                            <th>Clase</th>
                            <th class="text-center" style="width: 180px">Institucion</th>
                            <th class="text-center" style="width: 180px">Mapa Central</th>
                            <th class="text-center" style="width: 180px">Alumnos</th>
                            <th class="text-center" style="width: 180px">Solicitudes</th>
                            <th class="text-center" style="width: 180px">Ingresar</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr ng-repeat="clase in $parent.misClases ">
                            <td >
                              <span>
                                {{ clase.nombre}}
                              </span>
                            </td>
                            <td class="text-center">
                              <span >
                                {{ clase.institucion.nombre  || ' '}}
                              </span>
                            </td>
                            <td class="text-center">
                              <span >
                                {{ clase.mapaCentral.nombre|| ' ' }}
                              </span>
                            </td>
                            <td class="text-center">
                              <span >
                                {{ clase.users_situacionAceptado.length|| 0 }}
                              </span>
                            </td>
                            <td class="text-center">
                              <span >
                                {{ clase.users_situacionEspera.length || 0 }}
                              </span>
                            </td>
                            <td class="text-center">
                                <span class="fa fa-sign-in" ng-click="set_claseActual($index)">
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
