<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                Alumnos clase {{$parent.claseActual.nombre}}
            </b>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>

                    <table class="table table-striped table-hover table" style="width: 100%">
                        <thead>
                        <tr>
                            <th>Alumno</th>
                            <th class="text-center" style="width: 140px">Clase</th>
                            <th class="text-center" style="width: 100px">Institucion</th>
                            <th class="text-center" style="width: 180px">Mapa Central</th>
                            <th class="text-center" style="width: 50px">Detalle</th>
                        </tr>
                        </thead>

                        <tbody >
                        <tr ng-repeat="user in $parent.claseActual.users_situacionAceptado">
                            <td >
                                  <span>
                                    {{user.apellido + " " + user.nombre}}
                                  </span>
                            </td>
                            <td class="text-center">
                                  <span >
                                    {{claseActual.nombre }}
                                  </span>
                            </td>
                            <td class="text-center">
                                  <span >
                                    {{claseActual.institucion.nombre}}
                                  </span>
                            </td>
                            <td class="text-center">
                                  <span >
                                    {{claseActual.mapaCentral.nombre}}
                                  </span>
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-default btn-xs" ng-click="ver_detallesAlumno($index)">
                                    <span class="fa fa-search" aria-hidden="true" ></span>
                                </button>

                            </td>
                        </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
