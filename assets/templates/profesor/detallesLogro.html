<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div>
            <button type="button" class="btn btn-default btn" ng-click="volver_aMisionesClase()">
                <span class="fa fa-angle-double-left fa-1x" aria-hidden="true" > Lista de Misiones</span>
            </button>
        </div>

        <br>
        <div class="page-header" align="center" style="margin-top: 0px">
            <b class="titulos">
                {{$parent.claseActual.nombre}}:<br>Detalle logro
            </b>
        </div>


        <div class="container-fluid">
            <div class="row">
                <div >

                    <table class="table table-striped table-hover table" style="width: 100%">

                        <tr>
                            <th class="text-center" style="width: 180px">Nombre</th>
                            <td class="text-center"><span>{{logroActual.nombre}}</span></td>
                        </tr>

                        <tr>
                            <th class="text-center" style="width: 180px">Descripción</th>
                            <td class="text-center"><span>{{logroActual.descripcion}}</span></td>
                        </tr>

                        <tr>
                            <th class="text-center" style="width: 180px">NPC</th>
                            <td class="text-center"><span>{{logroActual.mision.npc}}</span></td>
                        </tr>

                    </table>

                    <br>
                    <div class="page-header" align="left" style="margin-top: 0px">
                        <b class="titulos">
                            Situación Alumnos
                        </b>
                    </div>
                    <table ng-show='habilitarTabla' class="table table-striped table-hover table" style="width: 100%">
                        <thead>
                        <tr>
                            <th>Alumno</th>
                            <th class="text-center" style="width: 200px">E-mail</th>
                            <th class="text-center" style="width: 100px">Realizó Actividad</th>
                        </tr>
                        </thead>


                        <tbody >
                        <tr ng-repeat="alumno in $parent.claseActual.users_situacionAceptado">
                            <td >
                                  <span>
                                    {{alumno.apellido +' '+ alumno.nombre}}
                                  </span>
                            </td>
                            <td class="text-center">
                                  <span >
                                     {{alumno.email}}
                                  </span>
                            </td>
                            <td class="text-center">
                                <span ng-show="tieneLogro[alumno.id]" class="fa fa-check" style="color:red" ></span>
                                <span ng-hide="tieneLogro[alumno.id]"class="fa fa-times" style="color:red"></span>
                            </td>

                        </tr>
                        </tbody>
                    </table>


                    </table>




                </div>
            </div>
        </div>

    </div>
</div>
