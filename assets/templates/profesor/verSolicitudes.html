<br>
<br>
<div class="container-fluid">
    <div class="div-form text-left" style="margin: auto;">
        <div class="page-header" align="center" style="margin-top: 0px">

            <b class="titulos">
                Solicitudes
            </b>
        </div>

        <div>
            <button class="btn btn-default btn-align" ng-click="crearClase()">Crear Clase</button>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div >
                    <br>

                    <table class="table table-striped table-hover table" style="width: 80%">
                        <thead>
                            <tr>
                                <th>Alumno</th>
                                <th class="text-center" style="width: 140px">Clase</th>
                                <th class="text-center" style="width: 100px">Institucion</th>
                                <th class="text-center" style="width: 180px">Mapa Central</th>
                                <th class="text-center" style="width: 50px">Aceptar</th>
                                <th class="text-center" style="width: 50px">Rechazar</th>
                            </tr>
                        </thead>

                        <tbody ng-repeat="clase in misClases">
                            <tr ng-repeat="user in clase.users_situacionEspera">
                                <td >
                                  <span>
                                    {{user.apellido + " " + user.nombre}}
                                  </span>
                                </td>
                                <td class="text-center">
                                  <span >
                                    {{clase.nombre }}
                                  </span>
                                </td>
                                <td class="text-center">
                                  <span >
                                    {{clase.institucion.nombre}}
                                  </span>
                                </td>
                                <td class="text-center">
                                  <span >
                                    {{clase.mapaCentral.nombre}}
                                  </span>
                                </td>
                                <td class="text-center">
                                  <span class="fa fa-check"
                                        ng-click="aceptarAlumnoEnClase(user,$index,$parent.$index)">
                                    </span>
                                </td>
                                <td class="text-center">
                                  <span class="fa fa-times"
                                        ng-click="rechazarAlumnoEnClase(user,$index,$parent.$index)">
                                    </span>
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
</div>
