				<label for="nombre">Nombre: </label>
				<input type="text" class="form-control" name="nombre" ng-model="usuario.nombre"
				placeholder="Introduce tu nombre" required>
			</div>
			<div class="form-group">
				<label for="apellido">Apellido: </label>
				<input type="text" class="form-control" name="apellido" placeholder="Introduce tu apellido"
				ng-model="usuario.apellido" required>
			</div>
			<div class="form-group">
				<label for="email">E-mail: </label>
				<input type="text" class="form-control" name="email" ng-model="usuario.email"
				placeholder="Introduce tu E-mail" required>
			</div>

			<div class="form-group">
				<label>Genero:</label>
				<br>

				<div class="radio">
					<label>
						<input type="radio" name="sexo" value="femenino" ng-model="usuario.sexo">
						Femenino </label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="sexo" value="masculino" ng-model="usuario.sexo" checked>
						Masculino </label>
				</div>
			</div>

			<div class="form-group">
				<label>Tipo:</label>
				<br>

				<div class="radio">
					<label>
						<input type="radio" name="tipo" value="alumno" ng-model="usuario.tipo">
						Alumno </label>
				</div>
				<div class="radio">
					<label>
						<input type="radio" name="tipo" value="profesor" ng-model="usuario.tipo" checked>
						Profesor </label>
				</div>
                <div class="radio">
                    <label>

                        Administrador </label>
                </div>

				<button class="btn btn-default btn-align" ng-click="subirForm()">

				</button>
