<div class="container-fluid">
	<div class="row">
		<div class="col-md-10" align="center">
			<div id="dcanvas" style="width: 800px; height: 480px; position: relative" align="left">
                <!--HUD superior-->
				<div id="hudSuperior" class="capaSup">
					<img src="data/sprites/characters/ym/face/pepe.png" style="float: left;">
					<div class="progress" style="margin-left: 100px; margin-top: 10px ;width: 200px">
						<div class="progress-bar progress-bar-striped progress-bar-warning" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width: 60%;"></div>

						<div style="position: absolute; float: left">
							<b>Energia</b>
						</div>
					</div>
					<div class="progress" style="margin-left: 100px; margin-top: -10px ;width: 200px">
						<div class="progress-bar progress-bar-striped" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100" style="width: 60%;"></div>

						<div style="position: absolute; float:left;">
							<b>Experiencia</b>
						</div>
					</div>
				</div>
                <!--HUD inferior-->
				<div id="jsapp" class="capaInf" style="width: 800px; height: 480px; position: relative">
					<div id="botonera" class="capaSup" style="height: 49px; width: 261px; position: absolute; bottom: 0px">
						<img id="btnInve" src="images/iconos/btn_inventario.png"/>
						<img id="btnMisi" src="images/iconos/btn_mision.png" style="margin-left: -4px;"/>
						<img id="btnLogr" src="images/iconos/btn_logros.png" style="margin-left: -4px;"/>
						<img id="btnTale" src="images/iconos/btn_talentos.png" style="margin-left: -4px;"/>
						<img id="btnPers" src="images/iconos/btn_personaje.png" style="margin-left: -4px;"/>
					</div>
					<img class="capaSup" id="audio" src="images/iconos/audio_on.png" style="position: absolute; bottom: 4px; right: 4px"/>

					<div id="inv" class="div-panel" ng-controller="inventarioContr">
						<p class="capaSup titulo-botonera">
							Inventario
						</p>
						<img src="images/iconos/inventario2.png">
						<table style="z-index: 10; margin-top: -250px; margin-left: 12px">
							<tr ng-repeat="x in inventario">
								<td>{{ x.sprite }}</td>
								<td>{{ x.sprite }}</td>
							</tr>
						</table>
					</div>

					<div id="mis" class="div-panel">
						<p class="capaSup titulo-botonera">
							Misiones
						</p>
						<img src="images/iconos/misiones2.png">
					</div>

					<div id="log" class="div-panel">
						<p class="capaSup titulo-botonera">
							Logros
						</p>
						<img src="images/iconos/logros2.png">
					</div>

					<div id="tal" class="div-panel">
						<p class="capaSup titulo-botonera">
							Talentos
						</p>
						<img src="images/iconos/talentos2.png">
					</div>

					<div id="per" class="div-panel">
						<p class="capaSup titulo-botonera">
							Personaje
						</p>
						<img src="images/iconos/personaje2.png">
					</div>
				</div>
                <!--pantalla-->
				<div id="screen"></div>
			</div>
		</div>
        <!--minimapa-->
		<div class="col-md-2" align="left">
			<div style="width: 176px; height: 176px">
				<img src="images/iconos/MarcoMap.png" style="position: absolute;float: left">
				<img id="btnMas" class="capaSup" style="position: absolute;float: right;" src="images/iconos/btnMas.png">
				<img id="btnMenos" class="capaSup" style="position: absolute;float: right;bottom: 0px;right: 34px" src="images/iconos/btnMenos.png">

				<div class="div-mapa" style="width: 156px; height: 156px; position: absolute; float: left; margin-left: 9px; margin-top: 11px">
					<!--img src="data/map/minimap/Inicio.png" width="156px" height="156px" style="position: absolute;float: left; margin-top: 11px"-->
				</div>

			</div>
		</div>
	</div>
</div>
