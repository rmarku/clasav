<div class="container-fluid">
	<div class="row">
		<div class="col-md-10" align="center">
			<div id="dcanvas" style="width: 800px; height: 480px; position: relative" align="left">

				<!--HUD SUPERIOR-->
				<div id="hudSuperior" class="capaSup">
					<img src="data/sprites/characters/masculino/face/pepe.png" style="float: left;">
					<div class="progress" style="margin-left: 100px; margin-top: 10px ;width: 200px">
						<div class="progress-bar progress-bar-striped progress-bar-warning" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="width: 60%;"></div>

						<div style="position: absolute; float: left">
							<b>Energia</b>
						</div>
					</div>
					<div class="progress" style="margin-left: 100px; margin-top: -10px ;width: 200px">
						<div class="progress-bar progress-bar-striped" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100" style="width: 60%;"></div>

						<div style="position: absolute; float:left;">
							<b>Experiencia</b>
						</div>
					</div>
				</div>

				<!--HUD INFERIOR-->
				<div id="jsapp" class="capaInf" style="width: 800px; height: 480px; position: relative">
					<div id="botonera" class="capaSup" style="height: 49px; width: 261px; position: absolute; bottom: 0px">
						<img id="btnInve" src="images/iconos/btn_inventario.png"/>
						<img id="btnMisi" src="images/iconos/btn_mision.png" style="margin-left: -4px;"/>
						<img id="btnLogr" src="images/iconos/btn_logros.png" style="margin-left: -4px;"/>
						<img id="btnTale" src="images/iconos/btn_talentos.png" style="margin-left: -4px;"/>
						<img id="btnPers" src="images/iconos/btn_personaje.png" style="margin-left: -4px;"/>
					</div>
					<img class="capaSup" id="audio" src="images/iconos/audio_on.png" style="position: absolute; bottom: 4px; right: 4px"/>

					<!--INVENTARIO-->
					<div id="inv" class="div-panel" ng-controller="inventarioContr" style="background: url('images/iconos/inventario2.png')">
						<p class="capaSup titulo-botonera">
							Inventario
						</p>

						<div id="items" style="padding: 41px 9px 0px 10px">
							<div ng-repeat="x in inventario" style="display: inline; width: 49px; height: 49px; border: 0px 0px 0px 0px; margin: 0px 0px 0px -3px">
								<img ng-src="{{x.sprite}}" title="{{x.nombreItem}}" width="48px" height="48px">
							</div>
						</div>
					</div>

					<!--MISIONES-->
					<div id="mis" class="div-panel" style="background: url('images/iconos/misiones2.png')">
						<p class="capaSup titulo-botonera">
							Misiones
						</p>
					</div>

					<!--LOGROS-->
					<div id="log" class="div-panel" style="background: url('images/iconos/logros2.png')">
						<p class="capaSup titulo-botonera">
							Logros
						</p>
					</div>

					<!--TALENTOS-->
					<div id="tal" class="div-panel" style="background: url('images/iconos/talentos2.png')">
						<p class="capaSup titulo-botonera">
							Talentos
						</p>
					</div>

					<!--PERSONAJE-->
					<div id="per" class="div-panel" ng-controller="personajeInvContr" style="background: url('images/iconos/personaje2.png')">
						<p class="capaSup titulo-botonera">
							Personaje
						</p>
						<!--div ng-repeat="x in personajeInv" style="display: inline; width: 49px; height: 49px; border: 0px 0px 0px 0px; margin: 0px 0px 0px -3px">
						<img ng-src="{{x.sprite}}" title="{{x.nombreItem}}">
						</div-->

						<!--div>
						<img ng-src="{{x.sprite}}" title="{{x.nombreItem}}" ng-if="x.parte == capa">
						</div-->
						<div align="left" style="width: 49px; position: absolute; margin-top: 42px; margin-left: 12px">
							<div id="itemCabeza" class="itemP"></div>
							<div id="itemPechera" class="itemP"></div>
							<div id="itemPantalon" class="itemP"></div>
							<div id="itemPie" class="itemP">
								<img src="../data/sprites/items/ep/15_botas.png">
							</div>
							<div id="itemMano" class="itemP"></div>

						</div>
						<!--canvas id="pj" width="32" height="48" style="position: absolute"></canvas-->
						<!--div id="imagenes" style="position: absolute"></div-->
						<div align="right" style="position: absolute; width: 49px; right: 8px; margin-top: 42px">
							<div id="itemEspec1" class="itemP"></div>
							<div id="itemEspec2" class="itemP"></div>
							<div id="itemCapa" class="itemP">
								<img src="../data/sprites/items/ep/3_capaDorada.png">
							</div>
							<div id="itemAnillo" class="itemP">
								<img src="../data/sprites/items/ep/12_anilloMagico.png">
							</div>
							<div id="itemArma" class="itemP">
								<img src="../data/sprites/items/ep/8_espada.png">
							</div>
						</div>
					</div>

					<!--FIN HUD INFERIOR-->
				</div>
				<!--pantalla-->
				<div id="screen"></div>
			</div>

			<!--CHAT-->
			<!--Se deberian agregar 2 funciones:-->
			<!--Si el imput tiene onFocus, deshabilitar las teclas para que el personaje no se mueva-->
			<!--Que el nick sea  el user.nombre-->
			<!--Scroll abajo del todo-->
			<div ng-controller="ChatController" style="width: 800px">
				<div class="divChat" id="divChat">
					<span ng-repeat="msj in chats | orderBy: 'createdAt'"> <b ng-class=""> {{msj.nick}} : </b> {{msj.mensaje}}
						<br>
					</span>
				</div>

				<input chat class="form-control" type="text" ng-model="mensaje"  id="msjChat" style="display: inline; width: 730px">
				<button type="submit" class="btn btn-default" id="btn_enviar" ng-click="envMsj()">
					Enviar
				</button>

			</div>

		</div>

		<!--MAPA-->
		<div class="col-md-2" align="left">
			<div style="width: 176px; height: 176px">
				<img src="images/iconos/MarcoMap.png" style="position: absolute;float: left">
				<img id="btnMas" class="capaSup" style="position: absolute;float: right;" src="images/iconos/btnMas.png">
				<img id="btnMenos" class="capaSup" style="position: absolute;float: right;bottom: 0px;right: 34px" src="images/iconos/btnMenos.png">

				<div id=divMinimapa class="div-mapa" style="width: 156px; height: 156px; position: absolute; float: left; margin-left: 9px; margin-top: 11px">
					<canvas id="canvasMinimap" width="156" height="156"></canvas>
					<!--img src="data/map/minimap/Inicio.png" width="156px" height="156px" style="position: absolute;float: left; margin-top: 11px"-->
				</div>

			</div>
		</div>
	</div>
</div>
