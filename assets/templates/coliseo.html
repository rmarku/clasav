<div class="container-fluid">
	<div class="row">
		<div class="col-md-10" align="center">
			<div style="width: 800px; height: 480px; position: relative; background-image: url('../images/coliseo/Coliseo.jpg');" align="left">

				<!--Ventana de Preguntas-->
				<div class="capaSup" ng-controller="preguntaColiseo" id="quest"
				style="width: 523px; height: 304px; position: absolute; left: 138px; top: 88px; background: url('images/coliseo/ventana.png')">
					<p class="capaSup titulo-botonera" style="margin-left: 80px" ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}">
						{{ x.materia }}
					</p>

					<div ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}" style="position: absolute; width: 384px; height: 64px; margin: 47px 0px 0px 50px">
						{{ x.pregunta }}
					</div>

					<img style="margin: 110px 70px;position: absolute" src="images/coliseo/opciones.png"/>
					<img style="margin: 150px 70px;position: absolute" src="images/coliseo/opciones.png"/>
					<img style="margin: 190px 70px;position: absolute" src="images/coliseo/opciones.png"/>
					<img style="margin: 230px 70px;position: absolute" src="images/coliseo/opciones.png"/>

					<span ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}" style="position: absolute; margin: 120px 80px"> {{ x.correcta }} </span>
					<span ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}" style="position: absolute; margin: 160px 80px"> {{ x.opcionA }} </span>
					<span ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}" style="position: absolute; margin: 200px 80px"> {{ x.opcionB }} </span>
					<span ng-repeat="x in preguntas | filter: { materia: 'Matematica' , id: 1}" style="position: absolute; margin: 240px 80px"> {{ x.opcionC }} </span>
				</div>

			</div>
		</div>

		<div class="col-md-2" align="left">
			<!--ventana de amigos-->
			<div class="titulo-botonera" style="background-color: #FBF8EF; border: 2px solid #FF8000; margin: 30px 0px; height: 277px;">
				<div style="background-color: #FF8000">
					<strong> Lista de Amigos </strong>
				</div>
				Conectados
				<div style="overflow-y: auto;"></div>
				Desconectados
				<div style="overflow-y: auto;"></div>
			</div>
		</div>
	</div>
</div>
