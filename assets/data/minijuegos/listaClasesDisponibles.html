<!DOCTYPE html>
<html ng-app="gameClasesApp">
	<head>
		<script src="/js/dependencies/angular/angular.js"></script>
		<script src="/js/dependencies/jquery/dist/jquery.js"></script>
		<script src="/js/juego/main.js"></script>
		<link rel="stylesheet" href="/js/dependencies/font-awesome/css/font-awesome.min.css">
		<style>
			.btn-default {
				color: #b8111f;
				border-color: #b8111f;
				-webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075), 0 0 8px rgba(184, 17, 31, .6);
				box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075), 0 0 8px rgba(184, 17, 31, .6)
			}
			.btn-default:hover, .btn-default:focus, .btn-default:active, .btn-default.active, .open > .dropdown-toggle.btn-default {
				background-color: #D82C3B;
				border-color: #b8111f;
				color: #D8D22C;
			}
			table {
				font-family: Arial, Helvetica, sans-serif;
				font-size: 12px;
			}
		</style>

	</head>
	<body style="background: none">
		<audio src='../../../data/sfx/pirate_hou.ogg' autoplay></audio>
		<div ng-controller="gameClasesController">
			<div class="text-left" style="margin: auto; padding: 0px">

				<table style="width: 100%; background-color: white; border-radius: 10px">
					<thead>
						<tr>
							<th>Clase</th>
							<th style="width: 120px">Mapa Central</th>
							<th style="width: 100px">Ingresar</th>
						</tr>
					</thead>
					<tbody>
						<tr ng-repeat="clase in misClases">
							<td><span> {{ clase.nombre}} </span></td>
							<td class="text-center"><span> {{ clase.mapaCentral.nombre}} </span></td>
							<td align="center"><span class="fa fa-sign-in" aria-hidden="true" type="button"
							ng-click="call_travel_by_genericClavLevelEntity(clase)" style="cursor: pointer; color: red"></span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</body>

	<script>
		var app = angular.module('gameClasesApp', []);

		app.controller('gameClasesController', ['$scope',
		function($scope) {

			///////////////////// DEFINIMOS LAS CLASES DE LA LISTA //////////////////////
			//Clonamos la lista de clases del juego
			$scope.misClases = JSON.parse(JSON.stringify(parent.game.misClases));

			var mapaInstanciaActualID = parent.game.mainPlayer.data.mapa_instancia.id;

			if (parent.me.game.currentLevel.name != 'ciudad') {
				//Quito como destino la clase en la que me encuentro actualmente
				for (var x = 0; x < $scope.misClases.length; x++) {
					var clase = $scope.misClases[x];

					if (clase.mapaCentral.id == mapaInstanciaActualID) {
						$scope.misClases.splice(x, 1);
						break;
					}
				}
				$scope.misClases.push({
					nombre : "Mapa principal",
					mapaCentral : {
						nombre : "ciudad"
					}
				});
			}
			///////////////////// FIN DEFINIMOS LAS CLASES DE LA LISTA //////////////////////

			$scope.call_travel_by_genericClavLevelEntity = function(claseToGo) {

				parent.game.claseActualId = claseToGo.id;
				parent.game.mision.cancelar();
				//Solo para cerrar la ventana de mision

				var data = {
					to : claseToGo.mapaCentral.nombre,
					spawn : "tp_puerto"
				};

				parent.game.travel_by_genericClavLevelEntity(data);

			}
		}]);

	</script>
</html>
