<html>
	<head>
		<link rel="stylesheet" type="text/css" href="../../../styles/comun.css" media="screen" />
		<style>
			td {
				text-align: center
			}
			input{
				text-align: center
			}
		</style>
		<script>
			function aleatorio(inferior, superior) {
				var numPosibilidades = superior - inferior
				var aleat = Math.random() * numPosibilidades
				aleat = Math.round(aleat)
				return parseInt(inferior) + aleat
			}
		</script>
	</head>
	<body>
		<canvas id="ejesC" width="300px" height="210px" style="border:1px solid black;"></canvas>

		<script>
			var c = document.getElementById("ejesC");
			var cxt = c.getContext("2d");
			
			for(i=0; i<300;){
				cxt.beginPath();
				cxt.strokeStyle = '#D8D8D8';
				cxt.moveTo(i+15, 0);
				cxt.lineTo(i+15, 210);
				i=i+15;
				cxt.stroke();	
			}
			
			for(i=0; i<200;){
				cxt.beginPath();
				cxt.strokeStyle = '#D8D8D8';
				cxt.moveTo(0, i+15);
				cxt.lineTo(300, i+15);
				i=i+15;
				cxt.stroke();	
			}
			cxt.beginPath();
			cxt.strokeStyle = '#FF0000';
			cxt.moveTo(150, 0);
			cxt.lineTo(150, 210);
			cxt.moveTo(0, 105);
			cxt.lineTo(300, 105);
			cxt.stroke();
			
			
		</script>

			P3=(<input type="text" id="x2" name="x2" size="3" disabled>,
			    <input type="text" id="y2" name="y2" size="3" disabled>) <br>

				yy0 = document.getElementById('y0').value = aleatorio(-7,7);

						final = 1;

		</form>
