<html>
	<head>
		<link rel="stylesheet" type="text/css" href="../../../styles/comun.css" media="screen" />
		<style>
			td {
				text-align: center
			}
			input {
				text-align: center
			}
		</style>
		<script>
			function aleatorio(inferior, superior) {
				var numPosibilidades = superior - inferior;
				var aleat = Math.random() * numPosibilidades;
				aleat = Math.round(aleat);
				return parseInt(inferior) + aleat;
			}
		</script>
	</head>
	<body>
		Acorde a la siguiente función... 
		<br>
		<form name="formulario" onchange="javascript:comprobar()">

			y=
			<input type="text" id="const" name="const" size="2" disabled>
			+
			(
			<input type="text" id="varY" name="varY" size="2" disabled>
			/
			<input type="text" id="varX" name="varX" size="2" disabled>
			) X
			<br><br>
			complete la tabla de X e Y:
			<br>
			<table>
				<tr>
					<td>
						X
					</td>
					<td>
						Y
					</td>
				</tr>
				<tr>
					<td>
						<input type="text" id="xx0" name="xx0" size="2" disabled>
					</td>
					<td>
						<input type="text" id="yy0" name="yy0" size="2">
					</td>
				</tr>
				<tr>
					<td>
						<input type="text" id="xx1" name="xx1" size="2" disabled>
					</td>
					<td>
						<input type="text" id="yy1" name="yy1" size="2">
					</td>
				</tr>
				<tr>
					<td>
						<input type="text" id="xx2" name="xx2" size="2" disabled>
					</td>
					<td>
						<input type="text" id="yy2" name="yy2" size="2">
					</td>
				</tr>
				<tr>
					<td>
						<input type="text" id="xx3" name="xx3" size="2" disabled>
					</td>
					<td>
						<input type="text" id="yy3" name="yy3" size="2">
					</td>
				</tr>
			</table>

			<script>
				varX2 = document.getElementById('varX').value = aleatorio(-10, 10);
				varX1 = document.getElementById('varY').value = aleatorio(-10, 10);
				varY = document.getElementById('const').value = aleatorio(-10, 10);
				
				var x=[0,0,0,0];
				x[0] = document.getElementById('xx0').value = 0;
				x[1] = document.getElementById('xx1').value = varX2;
				x[2] = document.getElementById('xx2').value = varX2*2;
				x[3] = document.getElementById('xx3').value = varX2*3;
				
				var final = -1;

				var y0, y1, y2, y3;

				function comprobar() {
					y0 = document.getElementById('yy0').value;
					y1 = document.getElementById('yy1').value;
					y2 = document.getElementById('yy2').value;
					y3 = document.getElementById('yy3').value;
					
					if (y0==varY+(varX1/varX2)*x[0] && 
					    y1==varY+(varX1/varX2)*x[1] &&
					    y2==varY+(varX1/varX2)*x[2] &&
					    y3==varY+(varX1/varX2)*x[3])
						final = 1;
					else
						final = -1;

					//alert(final);
				}
			</script>
		</form>

		<button class="btn-quest" onclick="parent.game.mision.siguiente(final)">
			Listo
		</button>
	</body>
</html>
