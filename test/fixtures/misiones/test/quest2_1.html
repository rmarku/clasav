<!DOCTYPE html>

<html>
	<head>
		<meta charset="UTF-8">
		<title></title>
		<script>
			function numeroAleatorioDecimales(min, max) {
				var num = Math.random() * (max - min);
				return num + min;
			}
		</script>
	</head>

	<body>
		<form>
			<input type="number" name="quantity" value="numeroAleatorioDecimales(1,30)">
		</form>
	</body>

</html>
